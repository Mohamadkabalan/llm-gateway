# Switchboard local stack. Run via `make up` (reads ../.env; see .env.example).
# Every published port binds to 127.0.0.1. Image tags are pinned (see PLAN.md §0).

name: switchboard

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  gateway:
    <<: *hardening
    build:
      context: ..
      dockerfile: Dockerfile
    image: switchboard/gateway:dev
    environment:
      SWITCHBOARD_REDIS_URL: redis://redis:6379/0
      SWITCHBOARD_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SWITCHBOARD_LOG_LEVEL: ${SWITCHBOARD_LOG_LEVEL:-info}
      SWITCHBOARD_LOG_FORMAT: ${SWITCHBOARD_LOG_FORMAT:-json}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "127.0.0.1:${SB_GATEWAY_PORT:-7080}:8080"
    volumes:
      - ../config:/app/config:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    stop_grace_period: 30s   # > SWITCHBOARD_SHUTDOWN_GRACE_SECONDS (25s) so streams can drain

  postgres:
    <<: *hardening
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${SB_POSTGRES_PORT:-7432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql   # PostgreSQL 18 images keep PGDATA under this path
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    <<: *hardening
    image: redis:8.10.3-alpine
    ports:
      - "127.0.0.1:${SB_REDIS_PORT:-7379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --enable-feature=exemplar-storage
    ports:
      - "127.0.0.1:${SB_PROMETHEUS_PORT:-7090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  tempo:
    <<: *hardening
    image: grafana/tempo:3.1.1
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempodata:/var/tempo

  grafana:
    <<: *hardening
    image: grafana/grafana:13.2.7
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports:
      - "127.0.0.1:${SB_GRAFANA_PORT:-7300}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      prometheus: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  redisdata:
  promdata:
  tempodata:
  grafanadata:
