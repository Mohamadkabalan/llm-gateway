global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  # One target per gateway replica: compose DNS returns every replica's address.
  - job_name: switchboard-gateway
    dns_sd_configs:
      - names: [gateway]
        type: A
        port: 9100
        refresh_interval: 10s

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
