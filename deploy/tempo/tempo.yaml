# Single-binary Tempo for local tracing, adapted from Tempo v3.1.1's
# example/docker-compose/single-binary config. The metrics generator (span metrics,
# service graphs) is left off until Phase 6.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
