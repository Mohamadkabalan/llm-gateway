name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.8"

jobs:
  lint:
    name: Lint, format, types, secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # gitleaks scans history
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: pre-commit (ruff, ruff-format, mypy --strict, gitleaks, hygiene)
        run: uv run pre-commit run --all-files --show-diff-on-failure

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -m "not integration and not live" --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage
          path: coverage.xml

  docker:
    name: Image, compose stack and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: switchboard/gateway:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image runs as non-root
        run: test "$(docker run --rm --entrypoint id switchboard/gateway:dev -u)" != "0"
      - name: Shipped config validates inside the image
        run: docker run --rm switchboard/gateway:dev validate-config
      - name: Fake provider runs from the same image
        run: docker run --rm --entrypoint fakeprovider switchboard/gateway:dev --help
      - name: Stack comes up healthy and the gateway is ready
        run: |
          make secrets   # .env from .env.example, with a random pepper and demo key
          docker compose -f deploy/compose.yaml --env-file .env up -d --wait --wait-timeout 180
          curl -fsS "http://127.0.0.1:7080/ready"
      - name: Integration tests (OpenAI SDK through the running stack)
        run: |
          uv sync --locked
          make test-integration
      - name: OpenAI TypeScript SDK tool round trip (through the Anthropic translation)
        run: make test-sdk-ts
      - name: Gateway logs
        if: always()
        run: docker compose -f deploy/compose.yaml --env-file .env logs --no-color gateway || true
      - name: Tear down
        if: always()
        run: docker compose -f deploy/compose.yaml --env-file .env down -v
