version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }   # matches [tool.uv] exclude-newer policy
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }

  - package-ecosystem: docker   # bench/k6 builder and runtime images
    directory: /bench/k6
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
