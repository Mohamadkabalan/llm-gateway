# Hooks run on every commit (`make install` sets them up) and in CI (`pre-commit run --all-files`).
# Revs are pinned to commit SHAs; the tag is kept in the comment.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      # Recorded SSE fixtures are byte-exact: an event stream must end with a blank line.
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/.*\.sse$
      - id: trailing-whitespace
        exclude: ^tests/fixtures/.*\.sse$
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^tests/fixtures/.*\.sse$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: ef6cf06c079dd6b299dfc720b0f14400c9d168e1  # frozen: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
