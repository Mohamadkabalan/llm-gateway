[project]
name = "switchboard"
version = "0.1.0"
description = "Self-hostable LLM gateway: one OpenAI-compatible endpoint with routing, fallback, caching, budgets and cost accounting."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiohttp>=3.12",
    "asyncpg>=0.30",
    "fastapi>=0.150",
    "orjson>=3.10",
    "prometheus-client>=0.21",
    "pydantic>=2.11",
    "pydantic-settings>=2.8",
    "pyyaml>=6.0.2",
    "redis[hiredis]>=6.0",
    "structlog>=25.1",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
switchboard = "switchboard.cli:main"
fakeprovider = "fakeprovider.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/switchboard", "src/fakeprovider"]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1",
    "asyncpg-stubs>=0.30",
    "fakeredis[lua]>=2.26",
    "httpx>=0.28",
    "hypothesis>=6.130",
    "mypy>=1.15",
    "openai>=3.0",
    "pre-commit>=4.2",
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.1",
    "ruff>=0.11",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "bench", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "C4",            # comprehensions
    "RUF",           # ruff-specific
    "ASYNC",         # async pitfalls (blocking calls in async code)
    "S",             # bandit security checks
    "PT",            # pytest style
    "PL",            # pylint subset
    "TID",           # tidy imports
    "DTZ",           # timezone-aware datetimes
    "N",             # naming
]
ignore = [
    "PLR0913",       # too many arguments: explicit dependencies beat parameter objects here
    "PLR2004",       # magic values: too noisy for HTTP status codes
]

[tool.ruff.lint.per-file-ignores]
# Tests use seeded RNGs (S311) and small synchronous file writes (ASYNC240) on purpose.
"tests/**" = ["S101", "S603", "S607", "PLR2004", "S105", "S106", "S311", "ASYNC240"]
"bench/**" = ["S101", "S603", "S607"]  # a harness that shells out to docker and git by design

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
plugins = ["pydantic.mypy"]
files = ["src", "tests", "bench", "scripts"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
markers = [
    "integration: needs the docker compose test stack",
    "live: calls real provider APIs (needs keys; never in CI by default)",
]

[tool.coverage.run]
source = ["switchboard"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

[tool.uv]
# Supply-chain cooldown: only resolve releases that have been public for ~2 weeks.
exclude-newer = "2026-11-13T00:00:00Z"
